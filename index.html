<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Generate ready-to-run Docker commands and compose files for SMB, NFS, WebDAV and FTP NAS containers — entirely in your browser."/>
  <meta name="theme-color" content="#007bff"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Docker NAS Container Creator"/>
  <meta property="og:description" content="Generate ready-to-run Docker commands and compose files for SMB, NFS, WebDAV and FTP NAS containers — entirely in your browser."/>
  <meta property="og:url" content="https://dikeckaan.github.io/Docker-NAS-Container-Creator/"/>
  <meta property="og:image" content="https://dikeckaan.github.io/Docker-NAS-Container-Creator/docs/screenshot-light.png"/>
  <title>Docker NAS Container Creator</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="container">
    <h1 data-i18n="app.title">Docker NAS Container Creator</h1>
    <p class="tagline" data-i18n="app.tagline"></p>

    <!-- Toolbar: presets, profiles, share link, import, language, theme -->
    <div class="toolbar">
      <select id="presetSelect" aria-label="Preset">
        <option value="" data-i18n="preset.custom"></option>
        <option value="publicGuest" data-i18n="preset.publicGuest"></option>
        <option value="family" data-i18n="preset.family"></option>
        <option value="mediaRo" data-i18n="preset.mediaRo"></option>
        <option value="timeMachine" data-i18n="preset.timeMachine"></option>
      </select>
      <select id="profileSelect" aria-label="Profiles">
        <option value="" data-i18n="profiles.none"></option>
      </select>
      <input type="text" id="profileName" data-i18n-ph="profiles.placeholder" aria-label="Profile name"/>
      <button type="button" id="btnProfileSave" class="secondary btn-small gridbtn" data-i18n="profiles.save"></button>
      <button type="button" id="btnProfileDelete" class="danger btn-small gridbtn" data-i18n="profiles.delete"></button>
      <span id="toolbarStatus" class="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <button type="button" id="btnShareLink" class="secondary btn-small gridbtn" data-i18n="toolbar.shareLink"></button>
      <button type="button" id="btnImportToggle" class="secondary btn-small gridbtn" data-i18n="toolbar.import"></button>
      <button type="button" id="btnReset" class="secondary btn-small gridbtn" data-i18n="toolbar.reset"></button>
      <select id="langSelect" data-i18n-title="lang.label">
        <option value="en">EN</option>
        <option value="tr">TR</option>
      </select>
      <button type="button" id="themeToggle" class="secondary btn-small gridbtn" data-i18n-title="theme.toggle">🌓</button>
    </div>

    <!-- Import panel -->
    <div id="importPanel" class="wrap-box hidden">
      <label for="importText" data-i18n="import.title"></label>
      <div class="muted tiny" data-i18n="import.hint"></div>
      <textarea id="importText" spellcheck="false"></textarea>
      <div class="inline">
        <button type="button" id="btnImportParse" class="btn-small btn-auto gridbtn" data-i18n="import.parse"></button>
        <span id="importStatus" class="status" aria-live="polite"></span>
      </div>
      <ul id="importIssues" class="issues"></ul>
    </div>

    <!-- Protocol & image -->
    <div class="row">
      <div>
        <label for="protocol" data-i18n="proto.label"></label>
        <select id="protocol">
          <option value="smb" data-i18n="proto.smb"></option>
          <option value="nfs" data-i18n="proto.nfs"></option>
          <option value="webdav" data-i18n="proto.webdav"></option>
          <option value="ftp" data-i18n="proto.ftp"></option>
        </select>
      </div>
      <div id="imageBlock">
        <label for="smbImage" data-i18n="image.label"></label>
        <select id="smbImage">
          <option value="dperson" data-i18n="image.dperson"></option>
          <option value="servercontainers" data-i18n="image.sc"></option>
        </select>
      </div>
    </div>
    <div id="imageWarn" class="callout-warn" data-i18n="image.warn"></div>
    <div id="scNote" class="callout-note hidden" data-i18n="smb.scNote"></div>
    <div id="protoPortNote" class="callout-note hidden"></div>

    <label for="name" data-i18n="name.label"></label>
    <input type="text" id="name" value="nas-container"/>

    <!-- Network -->
    <div class="row">
      <div>
        <label for="networkMode" data-i18n="net.label"></label>
        <select id="networkMode">
          <option value="bridge" data-i18n="net.bridge"></option>
          <option value="host" data-i18n="net.host"></option>
          <option value="macvlan" data-i18n="net.macvlan"></option>
        </select>
      </div>
      <div id="webdavPortBlock" class="hidden">
        <label for="webdavPort" data-i18n="webdav.port"></label>
        <input type="number" id="webdavPort" value="8080" min="1" max="65535"/>
      </div>
    </div>
    <div id="macvlanRow" class="row hidden">
      <div>
        <label for="macvlanNetwork" data-i18n="net.macvlanNet"></label>
        <input type="text" id="macvlanNetwork" placeholder="lan"/>
      </div>
      <div>
        <label for="macvlanIp" data-i18n="net.macvlanIp"></label>
        <input type="text" id="macvlanIp" placeholder="192.168.1.50"/>
      </div>
    </div>
    <div id="hostNetNote" class="callout-note hidden" data-i18n="net.hostNote"></div>

    <!-- PORTS (SMB, bridge mode) -->
    <div id="portsSection">
      <h3 data-i18n="ports.title"></h3>
      <div class="wrap-box">
        <div class="inline">
          <input type="checkbox" id="allPorts"/>
          <label for="allPorts" style="margin:0; font-weight:600;" data-i18n="ports.all"></label>
        </div>

        <div class="ports-grid" style="margin-top:8px;">
          <div class="hdr" data-i18n="ports.expose"></div>
          <div class="hdr" data-i18n="ports.cport"></div>
          <div class="hdr" data-i18n="ports.proto"></div>
          <div class="hdr" data-i18n="ports.host"></div>

          <div class="ports-cell-center">
            <input type="checkbox" class="p-expose" id="exp-137" data-cport="137" data-proto="udp" aria-label="Expose 137/udp">
          </div>
          <div class="ports-cell-center"><div class="ports-badge">137</div></div>
          <div class="ports-cell-center"><div class="ports-badge">udp</div></div>
          <div><input type="number" class="host-input p-host" id="host-137" placeholder="137" min="1" max="65535" aria-label="Host port for 137/udp"></div>

          <div class="ports-cell-center">
            <input type="checkbox" class="p-expose" id="exp-138" data-cport="138" data-proto="udp" aria-label="Expose 138/udp">
          </div>
          <div class="ports-cell-center"><div class="ports-badge">138</div></div>
          <div class="ports-cell-center"><div class="ports-badge">udp</div></div>
          <div><input type="number" class="host-input p-host" id="host-138" placeholder="138" min="1" max="65535" aria-label="Host port for 138/udp"></div>

          <div class="ports-cell-center">
            <input type="checkbox" class="p-expose" id="exp-139" data-cport="139" data-proto="tcp" aria-label="Expose 139/tcp">
          </div>
          <div class="ports-cell-center"><div class="ports-badge">139</div></div>
          <div class="ports-cell-center"><div class="ports-badge">tcp</div></div>
          <div><input type="number" class="host-input p-host" id="host-139" placeholder="139" min="1" max="65535" aria-label="Host port for 139/tcp"></div>

          <div class="ports-cell-center">
            <input type="checkbox" class="p-expose" id="exp-445" data-cport="445" data-proto="tcp" checked aria-label="Expose 445/tcp">
          </div>
          <div class="ports-cell-center"><div class="ports-badge">445</div></div>
          <div class="ports-cell-center"><div class="ports-badge">tcp</div></div>
          <div><input type="number" class="host-input p-host" id="host-445" placeholder="445" value="445" min="1" max="65535" aria-label="Host port for 445/tcp"></div>
        </div>

        <div class="muted tiny" style="margin-top:8px;" data-i18n="ports.tip"></div>
        <div id="dpersonPortToggles" class="inline" style="margin-top:12px; gap:16px;">
          <label class="inline" style="margin:0;">
            <input type="checkbox" id="smbPermFix" checked>
            <span class="tiny" data-i18n="ports.permfix"></span>
          </label>
          <label class="inline" style="margin:0;">
            <input type="checkbox" id="smbNmbd">
            <span class="tiny" data-i18n="ports.nmbd"></span>
          </label>
        </div>
        <div class="muted tiny" id="netbiosNote" data-i18n="ports.netbiosNote"></div>
      </div>
    </div>

    <!-- UID/GID/TZ/Workgroup -->
    <div id="inlineCreds">
      <div class="row-4">
        <div>
          <label for="uid" data-i18n="ids.uid"></label>
          <input type="number" id="uid" value="1000" min="0"/>
        </div>
        <div>
          <label for="gid" data-i18n="ids.gid"></label>
          <input type="number" id="gid" value="1000" min="0"/>
        </div>
        <div>
          <label for="tz" data-i18n="ids.tz"></label>
          <input type="text" id="tz" placeholder="Europe/Istanbul"/>
        </div>
        <div id="workgroupBlock">
          <label for="workgroup" data-i18n="ids.workgroup"></label>
          <input type="text" id="workgroup" placeholder="WORKGROUP"/>
        </div>
      </div>
      <div class="muted tiny" data-i18n="ids.note"></div>
    </div>

    <label for="restart" data-i18n="restart.label"></label>
    <select id="restart">
      <option value="no" data-i18n="restart.no"></option>
      <option value="always" data-i18n="restart.always"></option>
      <option value="unless-stopped" selected data-i18n="restart.unless-stopped"></option>
      <option value="on-failure" data-i18n="restart.on-failure"></option>
    </select>

    <!-- Samba options -->
    <div id="smbOptions">
      <h3 data-i18n="smb.title"></h3>
      <div class="wrap-box">
        <div class="inline" style="gap:16px;">
          <label class="inline" style="margin:0;" id="dpersonRecycleWrap">
            <input type="checkbox" id="smbRecycle">
            <span class="tiny" data-i18n="smb.recycle"></span>
          </label>
          <label class="inline" style="margin:0;">
            <input type="checkbox" id="smbWsdd">
            <span class="tiny" data-i18n="smb.wsdd"></span>
          </label>
        </div>
        <label for="smbGlobal" data-i18n="smb.global"></label>
        <textarea id="smbGlobal" style="min-height:60px;" data-i18n-ph="smb.globalHint" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- ENV MODE -->
    <div id="envSection">
      <h3 data-i18n="env.title"></h3>
      <div class="env-block">
        <div class="inline">
          <input type="radio" name="envmode" id="envNone" value="none" checked>
          <label for="envNone" style="margin:0;" data-i18n="env.none"></label>
        </div>

        <div class="inline">
          <input type="radio" name="envmode" id="envFile" value="file">
          <label for="envFile" style="margin:0;" data-i18n="env.file"></label>
        </div>
        <div id="envFileRow" class="row hidden" style="margin-top:8px;">
          <div>
            <label for="envPath" data-i18n="env.path"></label>
            <input type="text" id="envPath" value="./nas.env" placeholder="./nas.env"/>
          </div>
        </div>

        <div class="inline">
          <input type="radio" name="envmode" id="envEditor" value="editor">
          <label for="envEditor" style="margin:0;" data-i18n="env.editor"></label>
        </div>
        <div id="envEditorPanel" class="hidden" style="margin-top:8px;">
          <div class="row">
            <div>
              <label for="envFilename" data-i18n="env.filename"></label>
              <input type="text" id="envFilename" value="./nas.env" placeholder="./nas.env"/>
            </div>
          </div>

          <div class="inline" style="gap:10px; margin-top:6px;">
            <button type="button" id="btnSyncToEnv" class="btn-small secondary gridbtn btn-auto" data-i18n="env.sync"></button>
            <button type="button" id="btnApplyFromEnv" class="btn-small secondary gridbtn btn-auto" data-i18n="env.apply"></button>
            <label class="inline" style="margin-left:auto;">
              <input type="checkbox" id="includeUsersFromEnv"/>
              <span class="tiny" data-i18n="env.include"></span>
            </label>
          </div>

          <label for="envText" style="margin-top:10px;" data-i18n="env.contents"></label>
          <textarea id="envText" spellcheck="false"></textarea>

          <div class="inline" style="gap:12px;">
            <button type="button" id="btnValidateEnv" class="btn-small secondary gridbtn btn-auto" data-i18n="env.validate"></button>
            <button type="button" class="btn-small success gridbtn btn-auto" id="btnDownloadEnv" data-i18n="env.download"></button>
            <span id="envStatus" class="status" aria-live="polite"></span>
          </div>
          <ul id="envIssues" class="issues"></ul>
        </div>
      </div>
    </div>

    <div id="plainWarn" class="callout-warn" data-i18n="users.plainWarn"></div>

    <!-- USERS -->
    <div id="usersSection">
      <h3 data-i18n="users.title"></h3>
      <div id="usersWrap" class="wrap-box">
        <div class="users-grid hdr-row" style="margin-bottom:6px;">
          <div class="hdr" data-i18n="users.username"></div>
          <div class="hdr" data-i18n="users.password"></div>
          <div class="hdr" data-i18n="users.remove"></div>
        </div>
        <div id="usersList"></div>
        <button type="button" class="secondary btn-small btn-block" id="btnAddUser" data-i18n="users.add"></button>
        <div id="usersHint" class="muted tiny" style="margin-top:8px;"></div>
      </div>
    </div>

    <!-- SHARES -->
    <div id="sharesSection">
      <h3 data-i18n="shares.title"></h3>
      <div class="wrap-box">
        <div class="shares-grid hdr-row" style="margin-bottom:6px;">
          <div class="hdr" data-i18n="shares.hostPath"></div>
          <div class="hdr" data-i18n="shares.name"></div>
          <div class="hdr" data-i18n="shares.allowed"></div>
          <div class="hdr" data-i18n="shares.addAll"></div>
          <div class="hdr" data-i18n="shares.ro"></div>
          <div class="hdr" data-i18n="shares.guest"></div>
          <div class="hdr" data-i18n="shares.remove"></div>
        </div>
        <div id="sharesList"></div>
        <button type="button" class="secondary btn-small btn-block" id="btnAddShare" data-i18n="shares.add"></button>
        <div class="muted tiny" style="margin-top:8px;" data-i18n="shares.hint"></div>
      </div>
    </div>

    <!-- ADVANCED -->
    <h3 data-i18n="adv.title"></h3>
    <div class="wrap-box">
      <label class="inline" style="margin:0 0 8px;">
        <input type="checkbox" id="advHealth">
        <span class="tiny" data-i18n="adv.health"></span>
      </label>
      <div class="row">
        <div>
          <label for="advMemory" data-i18n="adv.memory"></label>
          <input type="text" id="advMemory" placeholder="512m"/>
        </div>
        <div>
          <label for="advCpus" data-i18n="adv.cpus"></label>
          <input type="text" id="advCpus" placeholder="1.5"/>
        </div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="output-container">
      <div class="inline" style="justify-content:space-between;">
        <h3 style="margin:0;" data-i18n="out.title"></h3>
        <label class="inline" style="margin:0;">
          <input type="checkbox" id="singleLineOut" checked>
          <span class="tiny" data-i18n="out.single"></span>
        </label>
      </div>

      <div id="errorBox" class="error" role="alert"></div>
      <div id="warnBox" class="callout-warn hidden">
        <strong data-i18n="out.warnings"></strong>
        <ul id="warnList" class="issues"></ul>
      </div>
      <div id="noteBox" class="callout-note hidden">
        <strong data-i18n="out.notes"></strong>
        <ul id="noteList" class="issues"></ul>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" id="tab-run" role="tab" aria-selected="true" data-i18n="out.run"></button>
        <button type="button" id="tab-compose" role="tab" aria-selected="false" data-i18n="out.compose"></button>
        <button type="button" id="tab-systemd" role="tab" aria-selected="false" data-i18n="out.systemd"></button>
      </div>
      <div id="outText" class="output" tabindex="0"></div>
      <div id="composeNote" class="muted tiny hidden" data-i18n="out.composeNote"></div>

      <div class="inline out-actions">
        <button type="button" class="success btn-small gridbtn" id="btnCopy" data-i18n="out.copy"></button>
        <button type="button" class="secondary btn-small gridbtn hidden" id="btnDownloadCompose" data-i18n="out.downloadCompose"></button>
        <button type="button" class="secondary btn-small gridbtn hidden" id="btnDownloadSystemd" data-i18n="out.downloadSystemd"></button>
        <span id="copyStatus" class="status" aria-live="polite"></span>
      </div>
    </div>

    <footer>
      <span data-i18n="footer.text"></span>
      &middot;
      <a href="https://github.com/dikeckaan/Docker-NAS-Container-Creator" target="_blank" rel="noopener" data-i18n="footer.source"></a>
    </footer>
  </div>

  <script src="js/command-builder.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ });
      });
    }
  </script>
</body>
</html>
